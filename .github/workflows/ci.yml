name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first (topological): the vue package's typecheck resolves
      # @nextmoe/edit-ui-core types from its built dist, and the playground
      # builds against both published entry points.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
