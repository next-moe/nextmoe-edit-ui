name: docs-image

# Build the demo/docs site image and push it to GHCR; Dokploy pulls the
# prebuilt image. Production never builds.
on:
  # Manual / API dispatch — the Release workflow's version bump commit is
  # [skip ci], so use this to rebuild the site after a release.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/playground/**'
      - 'packages/**'
      - 'docker/docs.Dockerfile'
      - '.dockerignore'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs-image.yml'

permissions:
  contents: read
  packages: write # push to GHCR

concurrency:
  group: docs-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/docs.Dockerfile
          push: true
          tags: |
            ghcr.io/next-moe/nextmoe-edit-ui-docs:latest
            ghcr.io/next-moe/nextmoe-edit-ui-docs:${{ github.sha }}
          cache-from: type=gha,scope=nextmoe-edit-ui-docs
          cache-to: type=gha,mode=max,scope=nextmoe-edit-ui-docs

      - name: Trigger Dokploy redeploy
        env:
          # Set this to the Dokploy app's deploy webhook URL (and disable that
          # app's Auto Deploy) so it pulls the freshly-built :latest.
          WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK_DOCS }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DOKPLOY_WEBHOOK_DOCS not set; image pushed to GHCR, skipping redeploy."
            exit 0
          fi
          curl -fsS -X POST "$WEBHOOK"
